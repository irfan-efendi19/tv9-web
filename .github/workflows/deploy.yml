name: Deploy via cPanel Git

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Vite (Tailwind CSS)
        run: |
          npm ci
          npm run build

      - name: Commit build hasil ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build -f
          git commit -m "chore: build assets [skip ci]" || echo "No changes"
          git push

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Trigger cPanel Git pull
        run: |
          curl -X POST "${{ secrets.CPANEL_WEBHOOK_URL }}"